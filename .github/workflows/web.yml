# Собирает веб-версию и публикует её на GitHub Pages при каждом изменении в ветке main.
# В ветке v0.2 только проверяет: типы и сборка, без публикации.
# Нужно один раз: Settings → Pages → Source: GitHub Actions,
# и Settings → Secrets and variables → Actions → Variables:
#   EXPO_PUBLIC_SUPABASE_URL и EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY (или закоммитьте файл .env).
name: Веб-версия

on:
  push:
    branches: [main, v0.2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка зависимостей
        run: |
          npm install
          npx expo install react-dom react-native-web @expo/metro-runtime
          npx expo install --fix

      - name: Ключи Supabase из переменных репозитория
        env:
          URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$URL" "$KEY" > .env
          fi
          test -f .env || { echo "Нет ключей Supabase: добавьте переменные репозитория или файл .env"; exit 1; }

      - name: Адрес сайта = имя репозитория
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            const repo = process.env.REPO;
            cfg.expo.experiments = { ...(cfg.expo.experiments || {}), baseUrl: repo.endsWith('.github.io') ? '' : '/' + repo };
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "

      - name: Проверка типов (с ошибкой сайт не обновится)
        run: npx tsc --noEmit

      - name: Сборка
        run: |
          npx expo export --platform web
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
